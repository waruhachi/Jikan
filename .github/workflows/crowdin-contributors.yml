name: Update Translator Credits

permissions:
    contents: write

on:
    push:
        branches:
            - main
        paths:
            - "layout/Library/Tweak Support/Jikan/Localization/**"
    schedule:
        - cron: "0 0 * * 1"
    workflow_dispatch:

jobs:
    contributors:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Generate Crowdin contributors
              uses: andrii-bodnar/action-crowdin-contributors@v3
              with:
                  files: README.md
                  min_words_contributed: 1
                  include_languages: true
                  image_size: 64
                  contributors_per_line: 6
                  excluded_users: waru
                  crowdin_project_link: https://crowdin.com/project/jikan
              env:
                  CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
                  CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

            - name: Commit changes
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  commit_message: "docs: update translator credits"
                  file_pattern: README.md
